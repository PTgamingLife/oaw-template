name: OAW setup
# Builds the OA app in this repository's owner's own accounts.
# Triggered by the Aprico build page (workflow_dispatch). Safe to re-run.
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: oaw-setup
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build the OA app
        run: node --experimental-strip-types scripts/oaw-setup.mjs
        env:
          OAW_PX: ${{ vars.OAW_PX || secrets.OAW_PX }}
          OAW_SB_REF: ${{ vars.OAW_SB_REF || secrets.OAW_SB_REF }}
          OAW_SB_ORG: ${{ vars.OAW_SB_ORG }}
          OAW_SB_REGION: ${{ vars.OAW_SB_REGION }}
          OAW_APRICO_RUNTIME_URL: ${{ vars.OAW_APRICO_RUNTIME_URL }}
          OAW_APRICO_DESIGN_URL: ${{ vars.OAW_APRICO_DESIGN_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OAW_SB_DB_PASS: ${{ secrets.OAW_SB_DB_PASS }}
          OAW_LINE_MSG_ID: ${{ secrets.OAW_LINE_MSG_ID }}
          OAW_LINE_MSG_SECRET: ${{ secrets.OAW_LINE_MSG_SECRET }}
          OAW_LINE_LOGIN_ID: ${{ secrets.OAW_LINE_LOGIN_ID }}
          OAW_LINE_LOGIN_SECRET: ${{ secrets.OAW_LINE_LOGIN_SECRET }}
          OAW_BIND_CODE: ${{ secrets.OAW_BIND_CODE }}
          OAW_APRICO_KEY: ${{ secrets.OAW_APRICO_KEY }}
      - name: Save status (public values only)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add oaw/status.json liff/config.js
          git diff --cached --quiet || git commit -m "OAW setup status"
          git pull --rebase origin main
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: liff
  pages:
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
