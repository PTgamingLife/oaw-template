name: OAW pages
# Republishes the LIFF page when it changes.
on:
  push:
    branches: [main]
    paths: ['liff/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Skip until the app has been set up (avoids a failed run right after the repo is created).
    if: vars.OAW_PX != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: liff
      - id: deployment
        uses: actions/deploy-pages@v4
